        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/michele-lamon/
        aria-label: LinkedIn
      - text: "ORCID"
        href: https://orcid.org/0009-0001-5500-6595
        aria-label: ORCID
